{% extends "base.html" %}
{% block title %}Configuração inicial{% endblock %}
{% block content %}
<div class="auth" style="max-width:560px">
  <div class="auth-topo">
    <div class="logo">👋</div>
    <h1>Bem-vindos!</h1>
    <p>Vamos criar as duas contas antes de começar.</p>
  </div>
  <div class="card">
    <form method="POST">
      <div class="setup-pessoas">
        {% for i in [1, 2] %}
        <fieldset>
          <legend>Pessoa {{ i }}</legend>
          <div class="campo"><label for="display{{ i }}">Nome</label><input id="display{{ i }}" type="text" name="display{{ i }}" placeholder="{{ 'ex: João' if i == 1 else 'ex: Maria' }}" required></div>
          <div class="campo"><label for="username{{ i }}">Usuário (login)</label><input id="username{{ i }}" type="text" name="username{{ i }}" placeholder="{{ 'ex: joao' if i == 1 else 'ex: maria' }}" required autocapitalize="none"></div>
          <div class="campo"><label for="password{{ i }}">Senha</label><input id="password{{ i }}" type="password" name="password{{ i }}" required autocomplete="new-password"></div>
        </fieldset>
        {% endfor %}
      </div>
      <button type="submit" class="btn btn-bloco" style="margin-top:14px">Criar contas</button>
    </form>
  </div>
</div>
{% endblock %}
