{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth-topo">
    <div class="logo">💰</div>
    <h1>Finanças da Casa</h1>
    <p>Entre para lançar ou conferir as contas.</p>
  </div>
  <div class="card">
    <form method="POST">
      <div class="campo"><label for="username">Usuário</label><input id="username" type="text" name="username" autofocus required autocapitalize="none" autocomplete="username"></div>
      <div class="campo"><label for="password">Senha</label><input id="password" type="password" name="password" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-bloco">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
