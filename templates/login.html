{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>💰 Finanças da Casa</h1>
  <p class="subtitle">Entre para lançar ou conferir as contas.</p>
  <form method="POST">
    <label>Usuário</label>
    <input type="text" name="username" autofocus required>
    <label>Senha</label>
    <input type="password" name="password" required>
    <button type="submit" class="btn-primary">Entrar</button>
  </form>
</div>
{% endblock %}
