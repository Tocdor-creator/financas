{% extends "base.html" %}
{% block title %}Entrar{% endblock %}

{% block content %}
<div class="acesso">
  <h1 class="acesso-titulo">Finanças da Casa</h1>
  <form class="cartao" method="post">
    <div class="campo">
      <label for="username">Usuário</label>
      <input id="username" type="text" name="username" required autofocus autocapitalize="none" autocomplete="username">
    </div>
    <div class="campo">
      <label for="password">Senha</label>
      <input id="password" type="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="botao botao-largo">Entrar</button>
  </form>
</div>
{% endblock %}
